name: Link check

on:
  pull_request:
    paths:
      - "src/**"
      - "**.md"
      - ".lycheeignore"
      - ".github/workflows/links.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 2
            --timeout 30
            README.md CONTRIBUTING.md CONTENT_LICENSE.md TRADEMARKS.md
            docs/**/*.md src/**/*.ts src/**/*.tsx
          fail: true
