name: 推荐新资源
description: 推荐公开课、开放教材、论文、工具或项目平台
title: "[资源推荐] "
labels: ["资源推荐", "待审核"]
body:
  - type: markdown
    attributes:
      value: |
        感谢推荐。提交前请确认资源合法公开，并尽量提供原始发布页面。
  - type: input
    id: name
    attributes:
      label: 资源名称
      placeholder: 例如 MIT 18.06 Linear Algebra
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 官方链接
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: 作者、学校或机构
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 资源类型
      options:
        - 公开课
        - 开放教材或书籍
        - 论文
        - 学习工具
        - 项目平台
        - 其他
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: 建议难度
      options:
        - 入门
        - 进阶
        - 高级
    validations:
      required: true
  - type: input
    id: subject
    attributes:
      label: 建议放入的学科与知识点
      placeholder: 例如 数学 / 线性代数
    validations:
      required: true
  - type: textarea
    id: prerequisites
    attributes:
      label: 前置要求
      description: 请列出学习该资源前真正需要掌握的知识。
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 内容简介与推荐理由
      description: 请说明课程完整度、自学友好度、练习或项目情况，以及评价依据。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已实际打开链接，并确认核心内容可以合法访问
          required: true
        - label: 这不是盗版、未授权镜像、广告或推广链接
          required: true
